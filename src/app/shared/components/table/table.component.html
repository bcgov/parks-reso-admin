<div class="table-responsive">
  <table class="table table-hover table-striped" id="tableSchema?.id">
    <thead class="header">
      <tr>
        @for (column of tableSchema?.columns; track column) {
          <th
            class="{{ column.columnClasses }}"
            [ngStyle]="{ width: column.width }"
            >
            {{ column.displayHeader }}
          </th>
        }
      </tr>
    </thead>
    @if (rows?.length > 0 && !loading) {
      <tbody>
        @for (row of rows; track row) {
          <tr
            app-table-row
            [columnSchema]="tableSchema.columns"
            [rowData]="row"
          ></tr>
        }
      </tbody>
    }
  </table>
</div>

@if (loading) {
  <div>
    <div class="d-flex justify-content-center">
      <div
        class="spinner-border spinner-border-lg"
        role="status"
        aria-hidden="true"
      ></div>
    </div>
  </div>
}
@if (rows?.length === 0 && !loading) {
  <div>
    <div class="d-flex justify-content-center">
      <div class="text-muted">
        {{ emptyTableMsg }}
      </div>
    </div>
  </div>
}
@if (lastEvaluatedKey && !loading) {
  <div>
    <div class="d-flex justify-content-center">
      <button class="btn btn-outline-secondary" (click)="loadMoreClicked()">
        Load more
      </button>
    </div>
  </div>
}
