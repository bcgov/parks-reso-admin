@if (label) {
  <label for="{{ id }}" class="fw-bold mb-2"
    >{{ label
    }}@if (isRequired()) {
    <span class="text-danger">&nbsp;*</span>
    }</label
    >
  }
  <div class="" [ngClass]="{ 'invalid-field': isInvalid() }">
    <textarea
      class="form-control"
      id="{{ id }}"
      rows="3"
      (change)="onInput($event)"
      [formControl]="control"
      maxlength="{{ charCap }}"
    ></textarea>
    @if (charCap) {
      <div class="d-flex flex-row-reverse">
        <p>{{ getFieldLength() }}/{{ charCap }}</p>
      </div>
    }
  </div>
