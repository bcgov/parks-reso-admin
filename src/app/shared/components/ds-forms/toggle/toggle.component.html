@if (label) {
  <label for="{{ id }}" class="fw-bold mb-2"
    >{{ label
    }}@if (isRequired()) {
    <span class="text-danger">&nbsp;*</span>
    }</label
    >
  }
  <div class="d-flex">
    <div
      class="form-check form-switch"
      [ngClass]="{ 'invalid-field': isInvalid() }"
      >
      @if (control) {
        <input
          type="checkbox"
          name="{{ id }}"
          id="{{ id }}"
          [formControl]="control"
          (ngModelChange)="onChange($event)"
          checked="getSwitchState()"
          class="form-check-input"
          attr.aria-label="{{ ariaLabel }}"
          attr.aria-describedby="{{ ariaDescribedBy }}"
          />
      }
    </div>
    <div class="d-flex">
      {{ description }}&nbsp;
      @if (getSwitchState()) {
        <div>{{ trueText }}</div>
      }
      @if (!getSwitchState()) {
        <div class="text-muted">{{ falseText }}</div>
      }
    </div>
  </div>
