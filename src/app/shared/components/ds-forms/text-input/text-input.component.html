@if (label) {
  <label for="{{ id }}" class="fw-bold mb-2"
    >{{ label
    }}@if (isRequired()) {
    <span class="text-danger">&nbsp;*</span>
    }</label
    >
  }

  <!-- For type number -->
  @if (!moneyMode && type === 'number') {
    <div
      class="input-group mb-3"
      [ngClass]="{ 'invalid-field': isInvalid() }"
      >
      @if (icon) {
        <span
          class="input-group-text"
          id="{{ ariaDescribedBy }}"
          [ngClass]="icon"
          ><i class="bi"></i
        ></span>
      }
      <input
        type="number"
        name="{{ id }}"
        id="{{ id }}"
        (keydown)="blockInvalidChars($event)"
        min="0"
        [formControl]="control"
        class="form-control"
        [class.with-item-left]="icon"
        placeholder="{{ placeholder }}"
        attr.aria-label="{{ ariaLabel }}"
        attr.aria-describedby="{{ ariaDescribedBy }}"
        />
    </div>
  }
  <!-- For type text -->
  @if (!moneyMode && type === 'text') {
    <div
      class="input-group mb-3"
      [ngClass]="{ 'invalid-field': isInvalid() }"
      >
      @if (icon) {
        <span
          class="input-group-text"
          id="{{ ariaDescribedBy }}"
          [ngClass]="icon"
          ><i class="bi"></i
        ></span>
      }
      <input
        type="text"
        name="{{ id }}"
        id="{{ id }}"
        [formControl]="control"
        class="form-control"
        placeholder="{{ placeholder }}"
        attr.aria-label="{{ ariaLabel }}"
        attr.aria-describedby="{{ ariaDescribedBy }}"
        />
    </div>
  }

  <!-- For currency -->
  @if (moneyMode) {
    <div
      class="input-group mb-3"
      [ngClass]="{ 'invalid-field': isInvalid() }"
      >
      <span
        id="{{ ariaDescribedBy }}"
        [ngClass]="icon"
        class="input-group-text"
        id="{{ ariaDescribedBy }}"
        ><i class="bi bi-currency-dollar"></i
      ></span>
      <input
        type="number"
        name="{{ id }}"
        id="{{ id }}"
        class="form-control"
        [formControl]="control"
        (keydown)="blockInvalidChars($event)"
        placeholder="{{ placeholder }}"
        step="0.01"
        attr.aria-label="{{ ariaLabel }}"
        attr.aria-describedby="{{ ariaDescribedBy }}"
        />
    </div>
  }
